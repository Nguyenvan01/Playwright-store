[pytest]
# Chạy từ thư mục gốc: config.py, pages/, keywords/... import trực tiếp.
pythonpath = .
testpaths = tests
# demo_failure_evidence.py không khớp mẫu -> suite mặc định không thu thập demo FAIL.
python_files = test_*.py
addopts = -ra --strict-markers --browser chromium
markers =
    core: unit test của framework (logging, taxonomy lỗi, hybrid binding) - không mở browser
    supplementary: hợp đồng dữ liệu Hybrid (Excel/JSON) - không mở browser
    failure_demo: demo cố tình FAIL để quan sát evidence
    e2e: UI test trên Desktop Chrome
    mobile: UI test trên thiết bị mobile (Pixel 7)
    api: test REST API, không cần browser
    keyword: kịch bản keyword-driven đọc từ Excel
    smoke: bộ kiểm tra nhanh sau mỗi lần deploy
    security: lỗ hổng bảo mật - cố ý để FAIL tới khi app được sửa (không đánh dấu xfail)
    role(name): chạy với phiên đăng nhập sẵn ("customer" hoặc "admin")
