# Chạy bộ test E2E trên web thật https://dat-hoang-store.vercel.app mỗi khi push / mở PR vào main.
# Có thể chạy tay: tab Actions -> "E2E production" -> Run workflow (chọn nhóm test theo marker).
#
# Cần khai báo 4 secret (Settings -> Secrets and variables -> Actions):
#   E2E_CUSTOMER_EMAIL, E2E_CUSTOMER_PASSWORD, E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD
# Thiếu secret thì các test cần đăng nhập tự skip, phần còn lại vẫn chạy.
name: E2E production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Biểu thức marker pytest (vd: smoke, "e2e and not security", security)'
        required: false
        default: "not security"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_ENV: prod
      E2E_ALLOW_WRITE: "0"
      E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # Mặc định bỏ nhóm security: các test này cố ý FAIL tới khi app vá lỗ hổng.
      MARKER: ${{ github.event.inputs.marker || 'not security' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Cài dependency
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Kiểm tra dữ liệu + thu thập test
        run: python -m pytest --collect-only -q -m "$MARKER"

      - name: Chạy test trên https://dat-hoang-store.vercel.app
        run: python -m pytest -m "$MARKER" -n 4

      - name: Tóm tắt kết quả
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml = Path("artifacts/prod/junit/results.xml")
          if not xml.exists():
              print("Không có file JUnit (test chưa chạy)."); raise SystemExit
          suite = ET.parse(xml).getroot().find("testsuite")
          total, fail, err, skip = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print(f"## E2E production ({__import__('os').environ['MARKER']})\n")
          print("| Tổng | Pass | Fail | Error | Skip/xfail |\n|---|---|---|---|---|")
          print(f"| {total} | {total - fail - err - skip} | {fail} | {err} | {skip} |\n")
          failed = [tc for tc in suite.iter("testcase") if tc.find("failure") is not None or tc.find("error") is not None]
          if failed:
              print("### Test thất bại\n")
              for tc in failed[:50]:
                  print(f"- `{tc.get('classname')}::{tc.get('name')}`")
          EOF

      - name: Lưu báo cáo (JUnit, Allure, log, ảnh, trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_number }}
          path: artifacts/prod/
          retention-days: 14
          if-no-files-found: ignore
